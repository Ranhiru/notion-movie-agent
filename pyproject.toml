[project]
name = "notion-db-updater"
version = "0.1.0"
description = "Notion movie/TV watchlist enrichment agent (LangGraph)"
requires-python = ">=3.13"

# Phase 0 pins the exact versions every later phase builds against. Spikes verify
# against *these installed versions*, not tutorials/memory. LangGraph + LangChain are
# both 1.x per the project conventions. Bump deliberately; re-run the spikes after.
dependencies = [
    # --- LangGraph / LangChain 1.x stack ---
    "langgraph==1.2.6",
    "langgraph-checkpoint-sqlite==3.1.0", # AsyncSqliteSaver (ADR 0007)
    "langchain==1.3.11",
    "langchain-openai==1.3.3",            # ChatOpenAI + with_structured_output (ADR 0008/0011)
    # --- HTTP / config ---
    "httpx==0.28.1",                      # Notion / OMDb / Firecrawl clients
    "python-dotenv==1.2.2",               # load .env in dev
    "pydantic-settings==2.14.2",          # typed Settings from env (Phase 1)
    "aiolimiter==1.2.1",                  # process-global Notion rate limiter (Phase 3)
    # --- Slack HITL transport (ADR 0010) ---
    "slack-bolt==1.28.0",
    "websocket-client==1.9.0",            # backing client for the sync SocketModeHandler
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/notion_db_updater"]

# Dev-only tooling (PEP 735 dependency group — uv installs it by default on `uv sync` /
# `uv run`, and excludes it from the built wheel). Pinned like the runtime deps.
[dependency-groups]
dev = [
    "ruff==0.14.6",          # lint + format (replaces flake8 + black + isort)
    "basedpyright==1.31.6",  # static type checker (matches the editor)
]

[tool.ruff]
line-length = 95
src = ["src"]
target-version = "py313"
# `spikes/` is throwaway Phase 0 code (not maintained, not type-checked) — keep it out of
# the lint/format gate, mirroring basedpyright's `include = ["src"]`.
extend-exclude = ["spikes"]

[tool.ruff.lint]
# E/F (pyflakes+pycodestyle), I (isort), UP (pyupgrade), B (bugbear), SIM (simplify).
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.basedpyright]
# "standard" = vanilla-pyright behaviour: catch real type errors, skip the Any-from-JSON
# and unused-result noise that basedpyright's stricter "recommended" default reports.
typeCheckingMode = "standard"
pythonVersion = "3.13"
include = ["src"]
